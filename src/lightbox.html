<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lightbox</title>

    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <a href="./index.html">⬅️ Back</a>
    <br />
    <hr />

    <form class="form">
      <label>
        <input
          class="query-field"
          type="text"
          name="search-text"
          placeholder="Search images..."
          id="query"
          required
        />
      </label>

      <button type="submit" id="search" class="search-btn" disabled>
        Search
      </button>
    </form>

    <span class="loader is-hidden"></span>

    <ul class="simply-gallery"></ul>

    <button type="button" id="load_more" class="is-hidden">Load more</button>

    <script type="module" src="./js/lightbox/lightbox.js"></script>
  </body>
</html>
